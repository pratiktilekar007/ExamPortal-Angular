<br>

<div class="bootstrap-wrapper">
    <div class="row">
        <div class="col-md-10">
            @for(que of Questions(); track que.quesId; ){
            <mat-card class="category-card">
                <mat-card-content>
                    <b> Q </b> {{que.content}}
                    <br>
                    <br>

                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-md-6">
                                <input type="radio" [value]="que.option1" [name]="'a'+ $index"
                                    [(ngModel)]="que.givenAnswer"> {{que.option1}}
                            </div>

                            <div class="col-md-6">
                                <input type="radio" [value]="que.option2" [name]="'a'+ $index"
                                    [(ngModel)]="que.givenAnswer"> {{que.option2}}
                            </div>

                            <div class="col-md-6">
                                <input type="radio" [value]="que.option3" [name]="'a'+ $index"
                                    [(ngModel)]="que.givenAnswer"> {{que.option3}}
                            </div>

                            <div class="col-md-6">
                                <input type="radio" [value]="que.option4" [name]="'a'+ $index"
                                    [(ngModel)]="que.givenAnswer"> {{que.option4}}
                            </div>
                        </div>
                    </div>

                </mat-card-content>

            </mat-card>
            }
        </div>

        <div class="col-md-2">

            <mat-card>
                <mat-card-header>
                    <mat-card-title>
                        Progress
                    </mat-card-title> 
                    
                </mat-card-header>
                <mat-card-content> 
                    <h5>{{getFormatedTime()}}</h5>
                    <mat-spinner mode="determinate" [value]="(timer / ( this.Questions().length * 1 * 60))*100"
                        style="margin: auto;"></mat-spinner>

                </mat-card-content>
            </mat-card>
        </div>


        <div class="container  mt15">
            <button mat-raised-button (click)="submitQueze()">Submit Quize</button>
        </div>
    </div>
</div>
