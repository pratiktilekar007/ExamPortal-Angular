<br>
@for (quz of quize(); track quz.qid) {
<mat-card class="category-card">
  <mat-card-header>
    <mat-card-title>Title : {{ quz.title }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>Description : {{ quz.description }}</p>
  </mat-card-content>
  <mat-card-content>
    <p>maxMarks : {{ quz.maxMarks }}</p>
  </mat-card-content>
  <mat-card-content>
    <p>numberOfQuestion : {{ quz.numberOfQuestion }}</p>
  </mat-card-content>
  <mat-card-content>
    <p>category : {{ quz.category.title }}</p>
    <div class="container  mt15">
      <button mat-raised-button (click)="deleteQuize(quz.qid)">Delete</button> &nbsp;
      <button mat-raised-button [routerLink]="'/admin/updatequizzes/'+quz.qid">Update</button>&nbsp;
      <button mat-raised-button [routerLink]="'/admin/viewquestions/'+quz.qid +'/' + quz.title">View Questions</button>&nbsp;
      <button mat-raised-button [routerLink]="'/admin/addquestions/'+quz.qid +'/' + quz.title">Add Questions</button>
    </div>
    
  </mat-card-content>

</mat-card>
}
